<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=340">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&display=swap');

    :root {
      --bg-base:    #0a0a14;
      --bg-card:    #12121f;
      --bg-elevated:#1a1a2e;
      --border:     rgba(255,255,255,.04);
      --border-accent: rgba(139,92,246,.15);
      --text:       #e0e0e0;
      --text-dim:   #6d6d8a;
      --text-muted: #4a4a5e;
      --accent:     #a78bfa;
      --accent-deep:#7c3aed;
      --green:      #22c55e;
      --red:        #ef4444;
      --radius:     10px;
      --transition: .25s cubic-bezier(.4,0,.2,1);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      width: 340px;
      font-family: 'Noto Kufi Arabic','Segoe UI',system-ui,sans-serif;
      background: var(--bg-base);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg,#1a1a3e,#0f0f2a);
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-left .logo { font-size:22px; filter: drop-shadow(0 0 6px rgba(167,139,250,.45)); }
    .header-left h1   { font-size:15px; font-weight:700; color:#c4b5fd; }
    .badge {
      font-size:9px; color:var(--text-dim);
      background:rgba(167,139,250,.1);
      padding:2px 7px; border-radius:4px;
    }

    /* ── Status bar ── */
    .status-bar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background var(--transition);
    }
    .status-bar.on  { background: linear-gradient(135deg,rgba(34,197,94,.06),transparent); }
    .status-bar.off { background: linear-gradient(135deg,rgba(239,68,68,.06),transparent); }
    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .dot {
      width:8px; height:8px; border-radius:50%;
      transition: all var(--transition);
    }
    .dot.on  { background:var(--green); box-shadow:0 0 8px rgba(34,197,94,.5); }
    .dot.off { background:var(--red);   box-shadow:0 0 8px rgba(239,68,68,.5); }
    .host {
      direction: ltr;
      font-size: 11px;
      color: #818cf8;
      font-weight: 400;
    }

    /* ── Sections ── */
    .section {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      animation: fadeUp .3s ease-out both;
    }
    .section:nth-child(3){ animation-delay:.04s }
    .section:nth-child(4){ animation-delay:.08s }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .section.locked {
      opacity:.35;
      pointer-events:none;
    }
    .section-title {
      font-size:11px; font-weight:600; color:var(--text-dim);
      letter-spacing:.4px; margin-bottom:10px;
      display:flex; align-items:center; gap:6px;
    }

    /* ── Toggle row ── */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      transition: opacity var(--transition);
    }
    .row + .row { border-top: 1px solid var(--border); }
    .row.muted  { opacity:.35; pointer-events:none; }
    .row-label  { display:flex; align-items:center; gap:8px; font-size:12.5px; }
    .row-label .ic { font-size:14px; width:20px; text-align:center; }

    .row.highlight {
      background: rgba(139,92,246,.05);
      margin: 0 -20px;
      padding: 7px 20px;
    }

    /* ── Toggle switch ── */
    .sw { position:relative; width:38px; height:20px; flex-shrink:0; }
    .sw input { opacity:0; width:0; height:0; position:absolute; }
    .track {
      position:absolute; inset:0; border-radius:20px;
      background:#2a2a3e; cursor:pointer;
      transition: all var(--transition);
    }
    .track::after {
      content:""; position:absolute;
      width:14px; height:14px; border-radius:50%;
      right:3px; top:3px;
      background:#555;
      transition: all var(--transition);
    }
    input:checked + .track {
      background: linear-gradient(135deg,var(--accent-deep),var(--accent));
      box-shadow: 0 0 10px rgba(167,139,250,.3);
    }
    input:checked + .track::after {
      transform: translateX(-18px);
      background: #fff;
    }
    input:focus-visible + .track {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .sep { height:1px; background:var(--border-accent); margin:6px 0; }

    /* ── Footer ── */
    .footer {
      padding:10px 20px;
      text-align:center;
      font-size:10px;
      color:var(--text-muted);
    }
    .shortcut { margin-top:6px; color:var(--text-dim); }
    .shortcut kbd {
      display:inline-block;
      direction:ltr;
      padding:1px 6px;
      border-radius:4px;
      background:var(--bg-elevated);
      border:1px solid var(--border-accent);
      color:var(--accent);
      font:600 10px/1.6 ui-monospace,Consolas,monospace;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <span class="logo">🔧</span>
      <h1>RTL Fix</h1>
      <span class="badge">v4.2</span>
    </div>
    <label class="sw" title="تشغيل / إيقاف">
      <input type="checkbox" id="master">
      <span class="track"></span>
    </label>
  </header>

  <!-- Status -->
  <div class="status-bar on" id="statusBar">
    <div class="status-left">
      <span class="dot on" id="dot"></span>
      <span id="statusLabel">مفعّلة</span>
    </div>
    <span class="host" id="host"></span>
  </div>

  <!-- Sites -->
  <section class="section" id="secSites">
    <div class="section-title"><span>🌐</span> المواقع</div>

    <div class="row highlight">
      <div class="row-label"><span class="ic">🌍</span><span>جميع المواقع</span></div>
      <label class="sw"><input type="checkbox" id="allSites"><span class="track"></span></label>
    </div>

    <div class="sep"></div>

    <div id="sites">
      <div class="row" data-s="claude.ai">
        <div class="row-label"><span class="ic">🟣</span><span>Claude</span></div>
        <label class="sw"><input type="checkbox" class="stoggle" data-s="claude.ai"><span class="track"></span></label>
      </div>
      <div class="row" data-s="chatgpt.com">
        <div class="row-label"><span class="ic">🟢</span><span>ChatGPT</span></div>
        <label class="sw"><input type="checkbox" class="stoggle" data-s="chatgpt.com"><span class="track"></span></label>
      </div>
      <div class="row" data-s="chat.openai.com">
        <div class="row-label"><span class="ic">🟢</span><span>OpenAI Chat</span></div>
        <label class="sw"><input type="checkbox" class="stoggle" data-s="chat.openai.com"><span class="track"></span></label>
      </div>
      <div class="row" data-s="gemini.google.com">
        <div class="row-label"><span class="ic">🔵</span><span>Gemini</span></div>
        <label class="sw"><input type="checkbox" class="stoggle" data-s="gemini.google.com"><span class="track"></span></label>
      </div>
    </div>
  </section>

  <!-- Options -->
  <section class="section" id="secOpts">
    <div class="section-title"><span>⚙️</span> الخيارات</div>

    <div class="row">
      <div class="row-label"><span class="ic">💻</span><span>إصلاح الكود بلوكات</span></div>
      <label class="sw"><input type="checkbox" id="codeBlockFix"><span class="track"></span></label>
    </div>
    <div class="row">
      <div class="row-label"><span class="ic">📊</span><span>إصلاح الجداول</span></div>
      <label class="sw"><input type="checkbox" id="tableFix"><span class="track"></span></label>
    </div>
    <div class="row">
      <div class="row-label"><span class="ic">✏️</span><span>إصلاح صندوق الكتابة</span></div>
      <label class="sw"><input type="checkbox" id="inputFix"><span class="track"></span></label>
    </div>
  </section>

  <div class="footer">
    RTL Fix — إصلاح اتجاه النص العربي
    <div class="shortcut" id="shortcutHint" title="يمكن تغييره من chrome://extensions/shortcuts">
      ⌨️ اختصار التشغيل / الإيقاف: <kbd id="shortcutKey">Alt+Shift+R</kbd>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
